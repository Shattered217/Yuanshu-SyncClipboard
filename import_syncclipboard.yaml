scripts:
- iconName: arrow.up.arrow.down.square.fill
  iconType: system
  name: 共享剪贴板
  content: |-
    async function output() {
      function utf8Bytes(value) {
        const bytes = []

        for (let index = 0; index < value.length; index += 1) {
          let codePoint = value.charCodeAt(index)
          if (codePoint >= 0xd800 && codePoint <= 0xdbff && index + 1 < value.length) {
            const low = value.charCodeAt(index + 1)
            if (low >= 0xdc00 && low <= 0xdfff) {
              codePoint = 0x10000 + ((codePoint - 0xd800) << 10) + (low - 0xdc00)
              index += 1
            }
          }

          if (codePoint <= 0x7f) {
            bytes.push(codePoint)
          } else if (codePoint <= 0x7ff) {
            bytes.push(0xc0 | (codePoint >> 6))
            bytes.push(0x80 | (codePoint & 0x3f))
          } else if (codePoint <= 0xffff) {
            bytes.push(0xe0 | (codePoint >> 12))
            bytes.push(0x80 | ((codePoint >> 6) & 0x3f))
            bytes.push(0x80 | (codePoint & 0x3f))
          } else {
            bytes.push(0xf0 | (codePoint >> 18))
            bytes.push(0x80 | ((codePoint >> 12) & 0x3f))
            bytes.push(0x80 | ((codePoint >> 6) & 0x3f))
            bytes.push(0x80 | (codePoint & 0x3f))
          }
        }

        return bytes
      }

      function base64Encode(value) {
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
        const bytes = utf8Bytes(value)
        let encoded = ""

        for (let index = 0; index < bytes.length; index += 3) {
          const first = bytes[index]
          const hasSecond = index + 1 < bytes.length
          const hasThird = index + 2 < bytes.length
          const second = hasSecond ? bytes[index + 1] : 0
          const third = hasThird ? bytes[index + 2] : 0

          encoded += alphabet[first >> 2]
          encoded += alphabet[((first & 0x03) << 4) | (second >> 4)]
          encoded += hasSecond ? alphabet[((second & 0x0f) << 2) | (third >> 6)] : "="
          encoded += hasThird ? alphabet[third & 0x3f] : "="
        }

        return encoded
      }

      function configuredValue(value, name) {
        if (value === undefined || value === null || String(value).length === 0) {
          throw new Error("请先在元书脚本变量中设置 " + name)
        }
        return String(value)
      }

      function safeLog(message) {
        try {
          $log(message)
        } catch (_) {
          // 日志失败不影响同步。
        }
      }

      function ensureSuccess(result) {
        const statusCode = result && result.response ? result.response.statusCode : undefined
        if (typeof statusCode === "number" && (statusCode < 200 || statusCode >= 300)) {
          throw new Error("服务器返回 HTTP " + statusCode)
        }
      }

      try {
        const serverUrl = configuredValue(
          typeof $syncClipboardUrl === "undefined" ? undefined : $syncClipboardUrl,
          "syncClipboardUrl"
        ).replace(/\/+$/, "")
        const username = configuredValue(
          typeof $syncClipboardUser === "undefined" ? undefined : $syncClipboardUser,
          "syncClipboardUser"
        )
        const password = configuredValue(
          typeof $syncClipboardPassword === "undefined" ? undefined : $syncClipboardPassword,
          "syncClipboardPassword"
        )

        if (!/^https:\/\//i.test(serverUrl)) {
          throw new Error("syncClipboardUrl 必须使用 HTTPS")
        }

        const authorization = "Basic " + base64Encode(username + ":" + password)
        if (typeof $pasteboardContent === "undefined") {
          throw new Error("请为此脚本开启“允许访问剪贴板”")
        }
        if (typeof $setClipboard !== "function") {
          throw new Error("当前元书版本不支持 $setClipboard")
        }

        const profileResult = await $http({
          url: serverUrl + "/SyncClipboard.json",
          method: "GET",
          header: {
            Authorization: authorization,
            Accept: "application/json"
          },
          timeout: 15
        })
        ensureSuccess(profileResult)

        const profile = typeof profileResult.data === "string"
          ? JSON.parse(profileResult.data || "{}")
          : (profileResult.data || {})
        if (!profile || ["Text", "Image", "File", "Group"].indexOf(profile.type) === -1) {
          throw new Error("服务端剪贴板类型无效")
        }

        const remoteIsText = profile.type === "Text"
        let remoteText = profile.text === null || profile.text === undefined ? "" : String(profile.text)
        if (remoteIsText && profile.hasData) {
          if (!profile.dataName) {
            throw new Error("远端文本缺少 dataName")
          }

          const dataName = String(profile.dataName).replace(/\\/g, "/").split("/").pop()
          const dataResult = await $http({
            url: serverUrl + "/file/" + encodeURIComponent(dataName),
            method: "GET",
            header: {
              Authorization: authorization,
              Accept: "text/plain"
            },
            timeout: 30
          })
          ensureSuccess(dataResult)
          remoteText = dataResult.data || ""
        }

        const localText = $pasteboardContent === null ? "" : String($pasteboardContent)
        if (remoteIsText && localText === remoteText) {
          safeLog("本机与远端剪贴板已经一致")
        } else {
          let localWasSynced = localText.length === 0
          if (!localWasSynced) {
            const searchProbe = localText.length > 200 ? localText.slice(0, 200) : localText
            const historyResult = await $http({
              url: serverUrl + "/api/history/query",
              method: "POST",
              header: {
                Authorization: authorization,
                "Content-Type": "application/x-www-form-urlencoded",
                Accept: "application/json"
              },
              body: {
                page: 1,
                types: 1,
                searchText: searchProbe
              },
              timeout: 15
            })
            ensureSuccess(historyResult)

            const history = typeof historyResult.data === "string"
              ? JSON.parse(historyResult.data || "[]")
              : (historyResult.data || [])
            if (!Array.isArray(history)) {
              throw new Error("服务端历史记录格式异常")
            }

            localWasSynced = history.some(function (item) {
              if (!item || item.type !== "Text" || item.isDeleted) {
                return false
              }
              const historyText = item.text === null || item.text === undefined ? "" : String(item.text)
              return historyText === localText || (item.hasData && localText.indexOf(historyText) === 0)
            })
          }

          if (!localWasSynced) {
            const result = await $http({
              url: serverUrl + "/SyncClipboard.json",
              method: "PUT",
              header: {
                Authorization: authorization,
                "Content-Type": "application/json",
                Accept: "application/json"
              },
              body: {
                type: "Text",
                text: localText,
                hasData: false,
                size: localText.length
              },
              timeout: 15
            })
            ensureSuccess(result)
            safeLog("检测到本机新内容，已上传 " + localText.length + " 个字符")
          } else if (remoteIsText) {
            $setClipboard(remoteText)
            safeLog("检测到远端新内容，已下载 " + remoteText.length + " 个字符")
          } else {
            safeLog("远端为 " + profile.type + "，手机没有待上传的新文本，已跳过")
          }
        }

        // 这是纯副作用脚本。成功时不返回布尔值，避免键盘将 true 当作上屏结果处理。
      } catch (error) {
        const message = "共享剪贴板失败：" + String(error)
        safeLog(message)
        return message
      }
    }
  isFavorite: false
  allowPasteboard: true
  tags: []
scriptVariables: []
scriptTags: []
